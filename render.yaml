services:
  - type: web
    name: toko-online-khas-jogja
    env: php
    buildCommand: "./render-build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT --env=production"
    envVars:
      - key: APP_NAME
        value: "Toko Online Khas Jogja"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: toko-online-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: toko-online-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: toko-online-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: toko-online-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: toko-online-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: toko-online-db
    databaseName: toko_online
    user: toko_online_user
